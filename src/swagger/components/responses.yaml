ValidationError:
  description: Validation error
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Validation failed

InternalError:
  description: Internal server error
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Internal server error

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Resource not found

Book:
  description: Book details
  content:
    application/json:
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              book:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  author:
                    type: string
                  isbn:
                    type: string
                  status:
                    type: string
                    enum: [available, checked_out]